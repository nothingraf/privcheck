[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nothingraf-privcheck"
version = "0.1.0"
description = "逐项核对数据使用、留存与同意状态，标出不合规项"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nothingraf" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://nothingraf.github.io"
Repository = "https://github.com/nothingraf/privcheck"
Issues = "https://github.com/nothingraf/privcheck/issues"

[project.scripts]
privcheck = "privcheck:main"

[tool.setuptools]
py-modules = ["privcheck"]
